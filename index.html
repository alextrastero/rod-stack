<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rectangle Stack</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #CCC;
      overflow: hidden;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    const params = {
      count: 50,
      width: 3,
      depth: 3,
      height: 0.1,
      gap: 0.02,
      maxTwist: Math.PI / 2,
      tiltEnabled: false,
      maxTilt: 0.6,
      ease: 0.08,
    };

    // Sampled from the reference photo of the painted stack.
    const PALETTE = [
      '#4a4870', // dark purple
      '#6a4f7a', // plum
      '#5d6a8a', // slate blue
      '#a9cdea', // light blue
      '#9aa3a8', // grey
      '#f2f2ee', // off-white
      '#1e2226', // near-black
      '#2f4a38', // dark green
      '#4f8a4a', // mid green
      '#8fca8a', // light green
      '#b9c4a8', // sage
      '#d9c88e', // sand
      '#f2d548', // yellow
      '#f0b545', // marigold
    ];

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(6, 5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(5, 10, 4);
    scene.add(sun);

    const randomColor = () => PALETTE[Math.floor(Math.random() * PALETTE.length)];

    // One color per slab index, kept across rebuilds so resizing doesn't reshuffle.
    const colors = [];
    const slabs = [];
    let geometry = null;

    function buildStack() {
      for (const slab of slabs) {
        scene.remove(slab);
        slab.material.dispose();
      }
      slabs.length = 0;
      geometry?.dispose();

      const { count, width, depth, height, gap } = params;
      geometry = new THREE.BoxGeometry(width, height, depth);
      const stackHeight = count * (height + gap);

      for (let i = 0; i < count; i++) {
        colors[i] ??= randomColor();
        const material = new THREE.MeshStandardMaterial({ color: colors[i] });
        const box = new THREE.Mesh(geometry, material);
        box.position.y = i * (height + gap) - stackHeight / 2;
        scene.add(box);
        slabs.push(box);
      }
    }

    function shuffleColors() {
      colors.length = 0;
      buildStack();
    }

    buildStack();

    const gui = new GUI({ title: 'Stack' });
    const shape = gui.addFolder('Shape');
    shape.add(params, 'count', 1, 300, 1).onChange(buildStack);
    shape.add(params, 'width', 0.2, 10, 0.1).onChange(buildStack);
    shape.add(params, 'depth', 0.2, 10, 0.1).onChange(buildStack);
    shape.add(params, 'height', 0.01, 1, 0.01).onChange(buildStack);
    shape.add(params, 'gap', 0, 0.5, 0.005).onChange(buildStack);
    shape.add({ shuffleColors }, 'shuffleColors').name('shuffle colors');
    const motion = gui.addFolder('Motion');
    motion.add(params, 'maxTwist', 0, Math.PI * 2, 0.01).name('max twist');
    motion.add(params, 'tiltEnabled').name('camera tilt');
    motion.add(params, 'maxTilt', 0, 1.5, 0.01).name('max tilt');
    motion.add(params, 'ease', 0.01, 1, 0.01);

    // Horizontal mouse position twists the stack: the bottom slab stays put,
    // the top slab turns by up to maxTwist radians.
    let mouseX = 0;
    let mouseY = 0;
    addEventListener('pointermove', (e) => {
      mouseX = (e.clientX / innerWidth) * 2 - 1;
      mouseY = (e.clientY / innerHeight) * 2 - 1;
    });

    // Vertical mouse position tilts the camera around the stack: top of the
    // screen looks down from above, bottom looks up from below.
    const cameraOffset = new THREE.Vector3();
    const cameraSpherical = new THREE.Spherical();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      const { maxTwist, tiltEnabled, maxTilt, ease } = params;

      slabs.forEach((slab, i) => {
        const target = mouseX * maxTwist * (i / Math.max(slabs.length - 1, 1));
        slab.rotation.y += (target - slab.rotation.y) * ease;
      });

      if (tiltEnabled) {
        cameraOffset.subVectors(camera.position, controls.target);
        cameraSpherical.setFromVector3(cameraOffset);
        const targetPhi = Math.PI / 2 + mouseY * maxTilt;
        cameraSpherical.phi += (targetPhi - cameraSpherical.phi) * ease;
        cameraOffset.setFromSpherical(cameraSpherical);
        camera.position.copy(controls.target).add(cameraOffset);
      }

      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
