<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rectangle Stack</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #CCC;
      overflow: hidden;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const COUNT = 50;
    const WIDTH = 3;
    const DEPTH = 3;
    const HEIGHT = 0.1;
    const GAP = 0.02;

    // Sampled from the reference photo of the painted stack.
    const PALETTE = [
      '#4a4870', // dark purple
      '#6a4f7a', // plum
      '#5d6a8a', // slate blue
      '#a9cdea', // light blue
      '#9aa3a8', // grey
      '#f2f2ee', // off-white
      '#1e2226', // near-black
      '#2f4a38', // dark green
      '#4f8a4a', // mid green
      '#8fca8a', // light green
      '#b9c4a8', // sage
      '#d9c88e', // sand
      '#f2d548', // yellow
      '#f0b545', // marigold
    ];

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(6, 5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(5, 10, 4);
    scene.add(sun);

    const geometry = new THREE.BoxGeometry(WIDTH, HEIGHT, DEPTH);
    const stackHeight = COUNT * (HEIGHT + GAP);
    const slabs = [];

    for (let i = 0; i < COUNT; i++) {
      const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      const material = new THREE.MeshStandardMaterial({ color });
      const box = new THREE.Mesh(geometry, material);
      box.position.y = i * (HEIGHT + GAP) - stackHeight / 2;
      scene.add(box);
      slabs.push(box);
    }

    // Horizontal mouse position twists the stack: the bottom slab stays put,
    // the top slab turns by up to MAX_TWIST radians.
    const MAX_TWIST = Math.PI / 2;
    const EASE = 0.08;
    let mouseX = 0;
    let mouseY = 0;
    addEventListener('pointermove', (e) => {
      mouseX = (e.clientX / innerWidth) * 2 - 1;
      mouseY = (e.clientY / innerHeight) * 2 - 1;
    });

    // Vertical mouse position tilts the camera around the stack: top of the
    // screen looks down from above, bottom looks up from below.
    const MAX_TILT = 0.6;
    const cameraOffset = new THREE.Vector3();
    const cameraSpherical = new THREE.Spherical();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      slabs.forEach((slab, i) => {
        const target = mouseX * MAX_TWIST * (i / (COUNT - 1));
        slab.rotation.y += (target - slab.rotation.y) * EASE;
      });

      cameraOffset.subVectors(camera.position, controls.target);
      cameraSpherical.setFromVector3(cameraOffset);
      const targetPhi = Math.PI / 2 + mouseY * MAX_TILT;
      cameraSpherical.phi += (targetPhi - cameraSpherical.phi) * EASE;
      cameraOffset.setFromSpherical(cameraSpherical);
      camera.position.copy(controls.target).add(cameraOffset);

      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
