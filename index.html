<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rectangle Stack</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #CCC;
      overflow: hidden;
    }
    #palette-box {
      position: fixed;
      top: 0;
      left: 15px;
      width: 180px;
      padding: 8px;
      background: #1f1f1f;
      color: #ebebeb;
      font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      border-radius: 0 0 4px 4px;
    }
    #palette-box.dragging { outline: 2px dashed #2cc9ff; }
    #palette-box label {
      display: block;
      padding: 6px;
      text-align: center;
      background: #424242;
      border-radius: 2px;
      cursor: pointer;
    }
    #palette-box label:hover { background: #4f4f4f; }
    #palette-box input { display: none; }
    #palette-preview {
      display: none;
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      margin-top: 8px;
      border-radius: 2px;
    }
    #palette-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-top: 8px;
    }
    #palette-swatches span {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="palette-box">
    <label>Upload image for palette<input type="file" accept="image/*"></label>
    <img id="palette-preview" alt="">
    <div id="palette-swatches"></div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    const params = {
      count: 50,
      width: 3,
      depth: 3,
      height: 0.1,
      gap: 0.02,
      maxTwist: Math.PI / 2,
      tiltEnabled: false,
      maxTilt: 0.6,
      ease: 0.08,
    };

    // Sampled from the reference photo of the painted stack.
    const DEFAULT_PALETTE = [
      '#4a4870', // dark purple
      '#6a4f7a', // plum
      '#5d6a8a', // slate blue
      '#a9cdea', // light blue
      '#9aa3a8', // grey
      '#f2f2ee', // off-white
      '#1e2226', // near-black
      '#2f4a38', // dark green
      '#4f8a4a', // mid green
      '#8fca8a', // light green
      '#b9c4a8', // sage
      '#d9c88e', // sand
      '#f2d548', // yellow
      '#f0b545', // marigold
    ];

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(6, 5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(5, 10, 4);
    scene.add(sun);

    let palette = DEFAULT_PALETTE;
    const randomColor = () => palette[Math.floor(Math.random() * palette.length)];

    // One color per slab index, kept across rebuilds so resizing doesn't reshuffle.
    const colors = [];
    const slabs = [];
    let geometry = null;

    function buildStack() {
      for (const slab of slabs) {
        scene.remove(slab);
        slab.material.dispose();
      }
      slabs.length = 0;
      geometry?.dispose();

      const { count, width, depth, height, gap } = params;
      geometry = new THREE.BoxGeometry(width, height, depth);
      const stackHeight = count * (height + gap);

      for (let i = 0; i < count; i++) {
        colors[i] ??= randomColor();
        const material = new THREE.MeshStandardMaterial({ color: colors[i] });
        const box = new THREE.Mesh(geometry, material);
        box.position.y = i * (height + gap) - stackHeight / 2;
        scene.add(box);
        slabs.push(box);
      }
    }

    function shuffleColors() {
      colors.length = 0;
      buildStack();
    }

    buildStack();

    const gui = new GUI({ title: 'Stack' });
    const shape = gui.addFolder('Shape');
    shape.add(params, 'count', 1, 300, 1).onChange(buildStack);
    shape.add(params, 'width', 0.2, 10, 0.1).onChange(buildStack);
    shape.add(params, 'depth', 0.2, 10, 0.1).onChange(buildStack);
    shape.add(params, 'height', 0.01, 1, 0.01).onChange(buildStack);
    shape.add(params, 'gap', 0, 0.5, 0.005).onChange(buildStack);
    shape.add({ shuffleColors }, 'shuffleColors').name('shuffle colors');
    const motion = gui.addFolder('Motion');
    motion.add(params, 'maxTwist', 0, Math.PI * 2, 0.01).name('max twist');
    motion.add(params, 'tiltEnabled').name('camera tilt');
    motion.add(params, 'maxTilt', 0, 1.5, 0.01).name('max tilt');
    motion.add(params, 'ease', 0.01, 1, 0.01);

    // Extracts `k` dominant colors from an image with k-means over a
    // downscaled copy of its pixels, seeded with k-means++.
    function extractPalette(img, k) {
      const size = 96;
      const scale = Math.min(1, size / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      const pixels = [];
      for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3] < 128) continue;
        pixels.push([data[i], data[i + 1], data[i + 2]]);
      }
      if (pixels.length === 0) return [];

      const dist = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;

      const centers = [pixels[Math.floor(Math.random() * pixels.length)]];
      const nearest = pixels.map((p) => dist(p, centers[0]));
      while (centers.length < k) {
        const total = nearest.reduce((sum, d) => sum + d, 0);
        if (total === 0) break;
        let r = Math.random() * total;
        let next = 0;
        while (r > nearest[next]) r -= nearest[next++];
        centers.push(pixels[next]);
        pixels.forEach((p, i) => { nearest[i] = Math.min(nearest[i], dist(p, pixels[next])); });
      }

      const assignment = new Array(pixels.length).fill(0);
      for (let iter = 0; iter < 12; iter++) {
        pixels.forEach((p, i) => {
          let best = 0;
          for (let c = 1; c < centers.length; c++) {
            if (dist(p, centers[c]) < dist(p, centers[best])) best = c;
          }
          assignment[i] = best;
        });
        const sums = centers.map(() => [0, 0, 0, 0]);
        pixels.forEach((p, i) => {
          const s = sums[assignment[i]];
          s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++;
        });
        sums.forEach((s, c) => {
          if (s[3] > 0) centers[c] = [s[0] / s[3], s[1] / s[3], s[2] / s[3]];
        });
      }

      return centers
        .map(([r, g, b]) => new THREE.Color(r / 255, g / 255, b / 255))
        .sort((a, b) => a.getHSL({}).l - b.getHSL({}).l)
        .map((c) => '#' + c.getHexString());
    }

    const paletteBox = document.getElementById('palette-box');
    const paletteInput = paletteBox.querySelector('input');
    const palettePreview = document.getElementById('palette-preview');
    const paletteSwatches = document.getElementById('palette-swatches');

    function showSwatches() {
      paletteSwatches.replaceChildren(...palette.map((hex) => {
        const swatch = document.createElement('span');
        swatch.style.background = hex;
        swatch.title = hex;
        return swatch;
      }));
    }

    function loadPaletteFromUrl(url) {
      const img = new Image();
      img.onload = () => {
        const extracted = extractPalette(img, 12);
        if (extracted.length > 0) {
          palette = extracted;
          showSwatches();
          shuffleColors();
        }
        if (palettePreview.src.startsWith('blob:')) URL.revokeObjectURL(palettePreview.src);
        palettePreview.src = url;
        palettePreview.style.display = 'block';
      };
      img.src = url;
    }

    function loadPaletteImage(file) {
      if (!file || !file.type.startsWith('image/')) return;
      loadPaletteFromUrl(URL.createObjectURL(file));
    }

    paletteInput.addEventListener('change', () => loadPaletteImage(paletteInput.files[0]));
    paletteBox.addEventListener('dragover', (e) => {
      e.preventDefault();
      paletteBox.classList.add('dragging');
    });
    paletteBox.addEventListener('dragleave', () => paletteBox.classList.remove('dragging'));
    paletteBox.addEventListener('drop', (e) => {
      e.preventDefault();
      paletteBox.classList.remove('dragging');
      loadPaletteImage(e.dataTransfer.files[0]);
    });

    showSwatches();
    loadPaletteFromUrl('caravaggio.jpg');

    // Horizontal mouse position twists the stack: the bottom slab stays put,
    // the top slab turns by up to maxTwist radians.
    let mouseX = 0;
    let mouseY = 0;
    addEventListener('pointermove', (e) => {
      mouseX = (e.clientX / innerWidth) * 2 - 1;
      mouseY = (e.clientY / innerHeight) * 2 - 1;
    });

    // Vertical mouse position tilts the camera around the stack: top of the
    // screen looks down from above, bottom looks up from below.
    const cameraOffset = new THREE.Vector3();
    const cameraSpherical = new THREE.Spherical();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      const { maxTwist, tiltEnabled, maxTilt, ease } = params;

      slabs.forEach((slab, i) => {
        const target = mouseX * maxTwist * (i / Math.max(slabs.length - 1, 1));
        slab.rotation.y += (target - slab.rotation.y) * ease;
      });

      if (tiltEnabled) {
        cameraOffset.subVectors(camera.position, controls.target);
        cameraSpherical.setFromVector3(cameraOffset);
        const targetPhi = Math.PI / 2 + mouseY * maxTilt;
        cameraSpherical.phi += (targetPhi - cameraSpherical.phi) * ease;
        cameraOffset.setFromSpherical(cameraSpherical);
        camera.position.copy(controls.target).add(cameraOffset);
      }

      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
